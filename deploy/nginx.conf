# 安装位置：/opt/homebrew/etc/nginx/servers/kotoba.conf（由 deploy/deploy.sh 复制）
server {
    listen 8090;
    server_name _;

    # 只允许 Tailscale 访问，局域网一律 403。
    # 127.0.0.1 是给 `tailscale serve`（HTTPS 入口）用的：它在本机把请求转发进来。
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    root /opt/homebrew/var/www/kotoba;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker 和 manifest 必须每次重新校验，否则更新推不到手机上
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html 也要每次校验，否则 PWA 会一直拿到引用旧资源的页面
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
